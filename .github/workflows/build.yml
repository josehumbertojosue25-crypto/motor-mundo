name: Compilar Motor Mundo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Construir jogo
        run: npm run build

      - name: Criar plataforma Android
        run: npx cap add android

      - name: Gerar ícones do MOTOR-MUNDO
        run: npx capacitor-assets generate --android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Configurar jogo em modo horizontal
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android)

          tree = ET.parse(p)
          root = tree.getroot()

          activities = root.findall(".//activity")

          matches = [
              activity for activity in activities
              if activity.get(f"{{{android}}}name", "").endswith("MainActivity")
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"Esperada uma MainActivity, encontradas: {len(matches)}"
              )

          matches[0].set(
              f"{{{android}}}screenOrientation",
              "landscape"
          )

          tree.write(p, encoding="utf-8", xml_declaration=True)

          print("SUCESSO: Motor Mundo configurado em Landscape.")
          PYTHON

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: motor-mundo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
