name: Compilar Motor Mundo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Construir jogo
        run: npm run build

      - name: Criar plataforma Android
        run: npx cap add android

      - name: Configurar repositório Maven alternativo
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/build.gradle")
          s = p.read_text()

          pattern = r"(?m)^([ \t]*)mavenCentral\(\)[ \t]*$"

          def add_repo(match):
              indent = match.group(1)
              return (
                  indent + "maven { url 'https://repo1.maven.org/maven2' }\n"
                  + indent + "mavenCentral()"
              )

          updated, count = re.subn(pattern, add_repo, s)

          if count < 2:
              raise SystemExit(
                  f"ERRO: esperados pelo menos 2 repositórios Maven Central; encontrados {count}"
              )

          p.write_text(updated)
          print(f"SUCESSO: repositório alternativo adicionado em {count} locais.")
          PYTHON

      - name: Gerar ícones do MOTOR-MUNDO
        run: npx capacitor-assets generate --android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Configurar jogo em modo horizontal
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android)

          tree = ET.parse(p)
          root = tree.getroot()

          activities = root.findall(".//activity")

          matches = [
              activity for activity in activities
              if activity.get(f"{{{android}}}name", "").endswith("MainActivity")
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"Esperada uma MainActivity, encontradas: {len(matches)}"
              )

          matches[0].set(
              f"{{{android}}}screenOrientation",
              "landscape"
          )

          tree.write(p, encoding="utf-8", xml_declaration=True)

          print("SUCESSO: Motor Mundo configurado em Landscape.")
          PYTHON

      - name: Testar acesso aos repositórios Maven
        run: |
          python3 - <<'PYTHON'
          import urllib.request

          urls = [
              "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.0/kotlin-stdlib-jdk8-1.9.0.pom",
              "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.0/kotlin-stdlib-jdk8-1.9.0.pom",
          ]

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Motor-Mundo-CI"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(f"HTTP {response.status}: {url}")
              except Exception as error:
                  print(f"FALHA: {type(error).__name__}: {error}")
                  print(url)
          PYTHON

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: motor-mundo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
