name: Compilar Motor Mundo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Construir jogo
        run: npm run build

      - name: Criar plataforma Android
        run: npx cap add android

      - name: Gerar ícones do MOTOR-MUNDO
        run: npx capacitor-assets generate --android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Configurar jogo em modo horizontal
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          activities = list(re.finditer(
              r'<activity\\b[^>]*>.*?</activity>',
              s,
              re.S
          ))

          targets = []

          for match in activities:
              block = match.group(0)
              if "android.intent.action.MAIN" in block and "android.intent.category.LAUNCHER" in block:
                  targets.append(match)

          if len(targets) != 1:
              raise SystemExit(
                  f"Esperada uma atividade principal, encontradas: {len(targets)}"
              )

          match = targets[0]
          block = match.group(0)

          if re.search(r'android:screenOrientation="[^"]*"', block):
              block = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="landscape"',
                  block
              )
          else:
              block = block.replace(
                  "<activity",
                  '<activity android:screenOrientation="landscape"',
                  1
              )

          s = s[:match.start()] + block + s[match.end():]
          p.write_text(s)

          print("Modo horizontal configurado com sucesso.")
          PYTHON

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: motor-mundo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
